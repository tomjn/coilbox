[package]
name = "coilbox"
version = "0.0.0"
description = "coilbox"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../crates/coilbox-portable" }
tauri-plugin-coilbox-downloads = { path = "../crates/tauri-plugin-coilbox-downloads" }
tauri-plugin-coilbox-uberstress = { path = "../crates/tauri-plugin-coilbox-uberstress" }
tauri-plugin-coilbox-mapconv = { path = "../crates/tauri-plugin-coilbox-mapconv" }
tauri-plugin-coilbox-anim = { path = "../crates/tauri-plugin-coilbox-anim" }
tauri-plugin-coilbox-content = { path = "../crates/tauri-plugin-coilbox-content" }
tauri-plugin-coilbox-unitsync = { path = "../crates/tauri-plugin-coilbox-unitsync" }
tauri-plugin-coilbox-play = { path = "../crates/tauri-plugin-coilbox-play" }
tauri-plugin-coilbox-campaign = { path = "../crates/tauri-plugin-coilbox-campaign" }
tauri-plugin-coilbox-scenario = { path = "../crates/tauri-plugin-coilbox-scenario" }
tauri-plugin-coilbox-lego = { path = "../crates/tauri-plugin-coilbox-lego" }
tauri-plugin-coilbox-conquest = { path = "../crates/tauri-plugin-coilbox-conquest" }
tauri-plugin-coilbox-runlite = { path = "../crates/tauri-plugin-coilbox-runlite" }
tauri-plugin-coilbox-profile = { path = "../crates/tauri-plugin-coilbox-profile" }
tauri-plugin-coilbox-lobby-servers = { path = "../crates/tauri-plugin-coilbox-lobby-servers" }
tauri-plugin-coilbox-hub = { path = "../crates/tauri-plugin-coilbox-hub" }
tauri-plugin-coilbox-multiplayer = { path = "../crates/tauri-plugin-coilbox-multiplayer" }
tauri-plugin-coilbox-direct = { path = "../crates/tauri-plugin-coilbox-direct" }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# generate_context! emits serde_json references when the updater config is present.
serde_json = "1"
# Dev-only AI-agent bridge: runs an MCP socket server so agents can screenshot/
# drive the app. tomjn fork carries a macOS window-finding fix not yet upstream.
# Always compiled, but only initialised under `#[cfg(debug_assertions)]` in main.rs.
# Pinned to the branch carrying the macOS capture-by-window-id fix, which is not
# yet merged to the fork's default branch. Capture targets Coilbox's own window
# (by PID/window id) rather than whatever is frontmost.
tauri-plugin-mcp = { git = "https://github.com/tomjn/tauri-plugin-mcp", branch = "fix/screenshot-by-window-id" }

# Job Object API: confine spawned sidecars so they die with us and can't hold
# their .exe locked during a Windows NSIS update (see src/win_job.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Windows/Linux only (issue #483): the OS has no while-running deep-link delivery
# there, so a second `coilbox://` launch starts a new process instead of reaching
# the running one. This plugin catches that second launch and, with the
# `deep-link` feature, forwards its argv straight into
# `tauri_plugin_deep_link::handle_cli_arguments`. macOS gets warm-start deep links
# from the OS already, so it does not need this and must not double-register it.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
