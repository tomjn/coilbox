# asset-importer-sys tells Assimp to use the system zlib on Unix, and Assimp then
# asks pkg-config for minizip. With Homebrew's minizip installed it finds one, drops
# its own copy of the sources, fails on `unzip.h`, and would not link against that
# library even past that error, because the crate never tells rustc about it.
# `scripts/build-prdownloader-macos.sh` documents the same trap for another binary.
# A Linux machine with libminizip-dev has the same pkg-config entry.
#
# `PKG_CONFIG_LIBDIR` would fix it, but `[env]` has no per-target form and it would
# hide GTK from the crates that find it through pkg-config on Linux. CMake is the
# only thing that reads a toolchain file, and the cmake crate takes this variable per
# target triple, so pkg-config stays untouched for everything else. Windows builds
# its own zlib and minizip, so it needs none of this.
#
# The real fix is one line upstream, `ASSIMP_BUILD_MINIZIP=ON` in asset-importer-sys.
#
# `[env]` does not override a value already set in the environment, so anyone who
# needs a different toolchain file can still pass their own.
[env]
CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin = { value = ".cargo/no-pkg-config.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_x86_64_apple_darwin = { value = ".cargo/no-pkg-config.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_gnu = { value = ".cargo/no-pkg-config.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_x86_64_unknown_linux_gnu = { value = ".cargo/no-pkg-config.cmake", relative = true }
