name: release

# Build and publish Coilbox for macOS, Linux, and Windows at a given version.
# Sidecars come from committed prebuilts under src-tauri/binaries/ per target
# triple. uberstress is an externalBin (tauri-build bundles it automatically);
# pr-downloader is assembled into the `prdownloader/` resource folder per runner
# (so its Windows DLLs ship beside it). macOS is arm64-only by design.
#
# KNOWN LIMITATION: the committed macOS binary links Homebrew dylibs (e.g.
# minizip), so the bundled sidecar needs those present at runtime. A portable mac
# release needs a static/self-contained pr-downloader build (or bundling its
# dylibs into the .app) — a future hardening step, not done here.

on:
  # The normal way to cut a release. The workflow creates the tag and the draft
  # release itself, so a release only ever exists once CI owns it and is a draft
  # from creation until the last step publishes it. Nothing has to be made in the
  # UI first, and nothing flips between published and draft on the way.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.15.6 (no leading v)"
        required: true
        type: string
  # Pushing a bare version tag still works, for cutting a release from a checkout
  # instead of the Actions tab. It takes the same path from prepare-release on.
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

# Two runs on one version would race each other for the same release and the same
# asset names.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# prepare-release creates the tag and the draft release, the build jobs upload
# artifacts to it, and publish-release makes it public.
permissions:
  contents: write

jobs:
  # Settle the version, the commit and the one release every other job writes to,
  # before anything is built. Both triggers meet here, so the rest of the workflow
  # has a single shape and never reads github.ref_name again.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Resolve the version and commit
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VER="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version must look like 1.2 or 1.2.3 with no leading v, got '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing $VER from $GITHUB_SHA"

      # Creating the tag through the API rather than pushing it is deliberate:
      # a ref created with GITHUB_TOKEN raises no push event, so this cannot set
      # off a second release run of itself.
      #
      # An existing tag is fine as long as it names the commit being built, which
      # covers both a tag push and a re-run after a failure. A tag pointing
      # somewhere else means the artifacts would not match what the tag says, so
      # that stops here.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Resolves an annotated tag to its commit, unlike the git ref endpoint.
          # Branching on the exit status rather than on the output, because gh
          # prints the API's error body on stdout and a missing tag would
          # otherwise read as a tag pointing at something unexpected.
          if ! TAGGED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$VER" --jq .sha 2>/dev/null)"; then
            TAGGED=""
          fi
          if [ -z "$TAGGED" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$VER" -f "sha=$GITHUB_SHA" --jq .ref
          elif [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "tag $VER already points at $TAGGED, not $GITHUB_SHA"
            echo "delete the tag or dispatch from the commit it names"
            exit 1
          else
            echo "tag $VER already points at this commit"
          fi

      # GitHub will happily hold two releases on one tag, and `gh release` then
      # resolves the tag to whichever one is published while tauri-action resolves
      # it to the draft. That split is what broke 1.15.5: the portable zip and
      # latest.json landed on different releases. So the count is checked here, and
      # the id is passed down for every later step to verify it is still writing to
      # the release this job settled on.
      - name: Create or claim the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          releases() {
            gh api --paginate "repos/$GH_REPO/releases" \
              --jq '.[] | select(.tag_name == env.VER) | "\(.id) \(.draft)"'
          }

          FOUND="$(releases)"
          COUNT="$(printf '%s\n' "$FOUND" | grep -c . || true)"

          if [ "$COUNT" -gt 1 ]; then
            echo "$COUNT releases already exist for tag $VER, delete all but one:"
            echo "$FOUND"
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            # The tag exists by now, so GitHub takes the commit from it and
            # --target would be ignored.
            gh release create "$VER" --draft --title "$VER" --generate-notes
            FOUND="$(releases)"
            COUNT="$(printf '%s\n' "$FOUND" | grep -c . || true)"
            test "$COUNT" -eq 1 || { echo "created the release but found $COUNT"; exit 1; }
          elif [ "${FOUND##* }" != "true" ]; then
            echo "a published release already exists for $VER (id ${FOUND%% *})"
            echo "delete it and run this workflow again"
            exit 1
          fi

          echo "release_id=${FOUND%% *}" >> "$GITHUB_OUTPUT"
          echo "Draft release ${FOUND%% *} ready for $VER"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smcng_platform` selects the SpringMapConvNG release asset; `exe` is the
          # binary suffix on Windows.
          # `cache_rust` restores the release-profile dependency cache primed on
          # main by release-cache.yml. Windows only - see the step below.
          - platform: macos-14 # arm64
            smcng_platform: macos-arm64
            exe: ""
            cache_rust: false
          - platform: ubuntu-22.04
            smcng_platform: linux-x86_64
            exe: ""
            cache_rust: false
          - platform: windows-latest
            smcng_platform: windows-x86_64
            exe: ".exe"
            cache_rust: true
    runs-on: ${{ matrix.platform }}
    steps:
      # The exact commit prepare-release tagged, not the branch head, so the three
      # platforms cannot build different code if main moves during the run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      # Pin an exact semver: setup-bun only resolves a tag through
      # api.github.com when the version isn't strict semver, and that API
      # going down took out a whole release build. An exact version skips
      # the lookup and downloads straight from the releases CDN.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdevil-dev provides libIL.so.1 / libILU.so.1 so linuxdeploy can
          # resolve and bundle the mapconv sidecars' DevIL deps into the AppImage
          # (the linux SpringMapConvNG build links system DevIL, not bundled libs).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdevil-dev

      # Restore the release-profile dependency artefacts that release-cache.yml
      # primes on main. Three things about this step are load bearing:
      #
      # Windows only. The repository's cache store is already past its 10 GB
      # limit and evicting, so three platforms' worth of release cache would
      # push each other and the lint cache out (#2806). Windows is also the
      # only platform whose time matters: publish-release waits for all three,
      # and Windows spends 16m40s on app compile against under 10 minutes
      # elsewhere (#2805), so it alone decides when a release goes live.
      #
      # save-if: false. A run can only restore a cache saved on its own ref or
      # on the default branch, so anything saved under refs/tags/1.13.3 is
      # unreadable by 1.13.4 - the duplicated bun keys in `gh cache list` are
      # this happening already. Saving here would burn cache space for nothing.
      #
      # shared-key. The automatic key includes the job id, so a cache saved by
      # the priming job would be filed under a key this job never looks for.
      # shared-key replaces that job-id portion with a fixed string, which is
      # the only way the two jobs can meet. It names the profile as well, so
      # the key moves by itself if the profile changes and the cache cannot
      # freeze on contents the build can no longer use (#2822). Keep it
      # identical to the priming job's.
      - uses: Swatinem/rust-cache@v2
        if: matrix.cache_rust
        with:
          shared-key: profile-release
          save-if: false

      # The release version is the one prepare-release settled on, not a number
      # hand-maintained in source. In source the bundle version is a 0.0.0
      # placeholder, and it is written here so the artifacts are versioned
      # correctly. (jq is preinstalled on all GitHub runners.)
      - name: Set the version
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
        run: |
          jq --arg v "$VER" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "App version set to $VER"

      - name: Install dependencies
        run: bun install

      # Fetch the pinned SpringMapConvNG release and extract its binaries + libs/
      # into src-tauri/mapconv/, bundled as a Tauri resource folder. The binaries
      # load image libs (DevIL etc.) via @executable_path/libs, so libs/ must sit
      # beside them — externalBin can't carry a folder. gitignored, not committed.
      - name: Fetch SpringMapConvNG sidecars
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < scripts/springmapconvng-version.txt)"
          ASSET="SpringMapConvNG-${VER}-${{ matrix.smcng_platform }}.tar.gz"
          EXE="${{ matrix.exe }}"
          rm -rf src-tauri/mapconv smcng_tmp
          mkdir -p src-tauri/mapconv smcng_tmp
          gh release download "$VER" --repo tomjn/SpringMapConvNG --pattern "$ASSET" --dir smcng_tmp
          tar -xzf "smcng_tmp/${ASSET}" -C src-tauri/mapconv
          chmod +x "src-tauri/mapconv/mapcompile${EXE}" "src-tauri/mapconv/mapdecompile${EXE}" || true

      # Unlike pr-downloader/uberstress (committed prebuilts), the unitsync
      # worker and the relay agent are our own workspace crates, so build them
      # here into src-tauri/binaries/ with the target-triple suffix Tauri's
      # externalBin bundling expects. The worker dlopens libunitsync at
      # runtime (no static link) so its binary is self-contained, and the
      # relay agent is pure Rust with tokio as its only dependency. One cargo
      # call plans both dependency graphs together, so shared deps build once
      # and the two crates compile in parallel instead of in turn.
      #
      # --timings writes target/cargo-timings/cargo-timing-<timestamp>.html,
      # uploaded below alongside the app build's own report (issue #2801).
      - name: Build unitsync worker and relay agent sidecars
        shell: bash
        run: bash scripts/build-sidecars.sh --timings coilbox-unitsync-worker coilbox-relay-agent

      # Assemble the pr-downloader resource folder for this runner's platform:
      # the committed prebuilt binary beside its Windows DLLs. Bundled as a
      # resource folder (not externalBin) so the DLLs ship in the same directory.
      - name: Assemble pr-downloader sidecar
        shell: bash
        run: bash scripts/assemble-prdownloader.sh

      # args forwards to `tauri build`, whose own [ARGS]... after `--` go to
      # the runner (cargo by default) rather than the tauri CLI itself - a
      # bare `--timings` here errors with "unexpected argument", confirmed
      # locally against `bunx tauri build --help`. --timings writes
      # target/cargo-timings/cargo-timing-<timestamp>.html plus a
      # cargo-timing.html copy of the latest run (issue #2801).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and emits latest.json. Set these repo
          # secrets from `tauri signer generate` (private key + its password);
          # the matching public key lives in tauri.conf.json plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # prepare-release has already made the draft, so tauri-action finds it
          # by tag and uploads into it. These two only matter if it ever has to
          # create one, and they match the draft's own name so a release made that
          # way is indistinguishable from the usual one.
          tagName: ${{ needs.prepare-release.outputs.version }}
          releaseName: ${{ needs.prepare-release.outputs.version }}
          releaseDraft: true
          prerelease: false
          args: -- --timings

      # A portable Coilbox on Windows cannot take an update through NSIS. The
      # installer picks its target folder from the registry, so a portable copy
      # inside a game's folder installs the update over the machine's ordinary
      # Coilbox and stays on the old version itself. src-tauri/src/portable_update.rs
      # has the full diagnosis, including why pointing NSIS at the portable folder
      # is worse rather than better. So the release also carries a plain zip of the
      # same payload, signed with the same key, for a portable install to unpack
      # over itself.
      #
      # The zip is built by running the installer we just built into a staging
      # folder, rather than by collecting files out of target/release. The layout a
      # player ends up with is the installer's doing and not the bundler's:
      # nsis-hooks.nsh moves every sidecar and resource folder into `.coilbox`
      # after the files are copied. Assembling the zip by hand would mean keeping a
      # second copy of that hook in step with the first.
      - name: Build and sign the Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.prepare-release.outputs.version }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SETUP="target/release/bundle/nsis/Coilbox_${VER}_x64-setup.exe"
          test -f "$SETUP" || { echo "no installer at $SETUP"; exit 1; }

          STAGING="$RUNNER_TEMP/portable"
          rm -rf "$STAGING"
          # /S silent, /NS no shortcuts. /D= sets the target and NSIS requires it
          # last and unquoted, so the path must have no spaces - $RUNNER_TEMP has
          # none. MSYS2_ARG_CONV_EXCL stops Git Bash rewriting the switches into
          # paths on the way through.
          MSYS2_ARG_CONV_EXCL='*' "./$SETUP" /S /NS /D=$(cygpath -w "$STAGING")

          # Registry entries and an uninstaller are the two things a portable copy
          # must never grow. It cannot write the registry from a zip, and this drops
          # the uninstaller.
          rm -f "$STAGING/uninstall.exe"

          # The installer is the only thing that knows the final layout, so check
          # it produced one rather than trusting a silent run's exit code. The app
          # binary is matched by extension rather than by name: the bundler takes
          # that name from the Tauri config, and a rename there should not quietly
          # start shipping an empty zip.
          #
          # Sidecars are excluded by their `coilbox-` prefix rather than counted,
          # because the relay agent stays in the install root on purpose. It is
          # the one sidecar that outlives coilbox (win_job.rs), so the installer
          # would have to kill a live relayed battle to move it safely.
          test -d "$STAGING/.coilbox" || { echo "installer did not tuck the sidecars away"; exit 1; }
          test "$(find "$STAGING" -maxdepth 1 -name '*.exe' ! -name 'coilbox-*.exe' | wc -l)" -eq 1 \
            || { echo "expected exactly one app .exe in $STAGING"; find "$STAGING" -maxdepth 1; exit 1; }

          ZIP="Coilbox_${VER}_x64-portable.zip"
          rm -f "$ZIP" "$ZIP.sig"
          (cd "$STAGING" && 7z a -tzip -mx=9 "$(cygpath -w "$GITHUB_WORKSPACE/$ZIP")" . > /dev/null)
          bunx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$ZIP"

          # `gh release upload` looks the release up by tag, which is the lookup
          # that sent 1.15.5's zip to a duplicate release. Checking the id it
          # resolves to costs one API call and turns that into a failed build.
          FOUND="$(gh release view "$VER" --json databaseId --jq .databaseId)"
          test "$FOUND" = "$RELEASE_ID" \
            || { echo "tag $VER now resolves to release $FOUND, not $RELEASE_ID"; exit 1; }
          gh release upload "$VER" "$ZIP" "$ZIP.sig" --clobber

      # The sidecar build above and tauri-action's app build both run cargo
      # against the same workspace target/, so this one glob picks up both
      # timestamped reports. Named per platform so the three uploads don't
      # collide (issue #2801).
      - name: Upload cargo timings report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.platform }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn

  # Every platform has now uploaded to the same draft, so publish it in one step
  # and the release only ever goes live with all its artifacts attached. This is
  # the single publish point, and the draft it publishes is the one prepare-release
  # created, so a release is never public before CI is finished with it.
  publish-release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VER: ${{ needs.prepare-release.outputs.version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
    steps:
      # Everything below addresses the release by tag, so confirm the tag still
      # names the release prepare-release settled on, and that all three platforms
      # plus the portable zip actually landed on it. 1.15.5 failed one step later
      # than this, on jq reading a file that had silently never downloaded.
      - name: Check the release is whole
        run: |
          set -euo pipefail
          FOUND="$(gh release view "$VER" --json databaseId --jq .databaseId)"
          test "$FOUND" = "$RELEASE_ID" \
            || { echo "tag $VER now resolves to release $FOUND, not $RELEASE_ID"; exit 1; }

          HAVE="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --jq '.[].name')"
          MISSING=""
          for want in \
            "latest.json" \
            "Coilbox_${VER}_x64-setup.exe" \
            "Coilbox_${VER}_x64-portable.zip" \
            "Coilbox_${VER}_x64-portable.zip.sig" \
            "Coilbox_${VER}_amd64.AppImage" \
            "Coilbox_${VER}_aarch64.dmg" \
            "Coilbox_aarch64.app.tar.gz"; do
            printf '%s\n' "$HAVE" | grep -qxF "$want" || MISSING="$MISSING $want"
          done
          if [ -n "$MISSING" ]; then
            echo "release $RELEASE_ID is missing:$MISSING"
            echo "it has:"
            printf '%s\n' "$HAVE"
            exit 1
          fi

      # Tell the app about the portable zip, before anyone can see the release.
      #
      # tauri-action writes latest.json with only the target keys its own updater
      # resolves, and an extra key is safe to add: the plugin looks up
      # windows-x86_64 exactly as before and ignores the rest, while the whole
      # manifest reaches the frontend as `update.rawJson`. That is where
      # src/updater/portableUpdate.ts reads the url and signature from, so no part
      # of the app has to guess an asset name.
      #
      # It has to happen here rather than in the Windows job: all three platforms
      # upload to the same latest.json, and a patch applied before the others
      # finish would be overwritten by them.
      - name: Add the portable zip to latest.json
        run: |
          set -euo pipefail
          ZIP="Coilbox_${VER}_x64-portable.zip"
          rm -rf manifest && mkdir manifest
          gh release download "$VER" --pattern latest.json --pattern "$ZIP.sig" --dir manifest
          jq \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$VER/$ZIP" \
            --rawfile sig "manifest/$ZIP.sig" \
            '.platforms["windows-x86_64-portable"] = { signature: ($sig | rtrimstr("\n")), url: $url }' \
            manifest/latest.json > manifest/patched.json
          mv manifest/patched.json manifest/latest.json
          gh release upload "$VER" manifest/latest.json --clobber

      - name: Publish the release
        run: gh release edit "$VER" --draft=false
