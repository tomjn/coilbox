name: lint

# Lint and format checks for pull requests (and pushes to main). Covers both
# source surfaces: the TypeScript/React frontend (Biome + tsc) and the Rust
# workspace (rustfmt + clippy). No release concerns here — clippy compiles
# source but does not bundle, so the SpringMapConvNG sidecars and a built
# frontend (dist/) are not needed.

on:
  pull_request:
  push:
    branches: [main]

# Every job sets timeout-minutes. GitHub's default is six hours, and a runner
# that wedges on an apt install holds the pull request's checks pending for all
# of it. These limits are several times the observed run times, so a healthy but
# slow run still finishes while a stall turns red within the hour.

jobs:
  # Which jobs a pull request's files can affect (scripts/ci-changes.sh). A
  # pull request is checked out as a merge commit whose first parent is the
  # base branch, so diffing the two lists the pull request's changes. A push to
  # main runs every job, which also keeps main's caches saved.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      lua: ${{ steps.filter.outputs.lua }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'rust=true\nlua=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Exact semver keeps setup-bun off api.github.com (see release.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome (lint + format check)
        run: bunx biome ci .
      # An English plural built by hand cannot be translated. Counts go through
      # an ICU plural message (#4605).
      - name: No hand-rolled plurals
        run: scripts/plural-check.sh
      - name: Typecheck
        run: bun run typecheck
      # Each locale's translated share goes in the job summary, so a pull
      # request that adds strings shows what it left untranslated. Only a failed
      # extract fails this step. It calls Lingui directly with the flags
      # `i18n:extract` uses, because under `bun run` the statistics table never
      # reaches a pipe or a file.
      - name: Translation coverage
        run: |
          bunx lingui extract --clean --verbose > "$RUNNER_TEMP/extract.log"
          scripts/i18n-coverage.sh "$RUNNER_TEMP/extract.log" >> "$GITHUB_STEP_SUMMARY" || true
      # A translatable string added, changed or removed without re-running
      # extract leaves the catalogs behind the code, and the diff shows how.
      - name: Translation catalogs match the code
        run: git diff --exit-code src/locales

  # Vitest is the long tail of the frontend checks, so it runs in its own jobs,
  # split by file across two shards that run side by side.
  vitest:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      # Exact semver keeps setup-bun off api.github.com (see release.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # src/lego/luaScript.test.ts and pieceCollisionScript.test.ts shell out
      # to luajit via spawnSync to check the Lua they generate actually
      # compiles. Without the binary, spawnSync returns a null status and the
      # tests fail on a missing dependency rather than a real Lua error.
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Vitest
        run: bun run test --shard=${{ matrix.shard }}/2

  # The conquest map generators must build the same map from a seed on every
  # platform. The Linux vitest job above already runs their fixture tests, so
  # this runs only those files on macOS and Windows. It needs no LuaJIT. Vitest
  # runs on Node, which is V8 on every runner, so this checks the operating
  # system and CPU, not the JavaScriptCore engine the macOS and Linux webviews
  # use. Running the same files with `bun test` would add that.
  #
  # The filter is a substring of the file path, so a new generator's fixture
  # file is picked up when it is named *Golden.test.ts anywhere under src. That also covers the other golden
  # files (runlite, saved projects), which pin deterministic output too.
  # Vitest exits non-zero when the filter matches no file, so the job cannot
  # pass by running nothing.
  map-fixtures:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Exact semver keeps setup-bun off api.github.com (see release.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Map generator fixtures
        run: bun run test Golden.test

  # The mission runtime and the blueprint widget are Lua the engine runs, so
  # neither the frontend nor the Rust job compiles them and a break would
  # otherwise reach a game. The suites need luajit and nothing else. The engine harness
  # (scripts/mission-headless.sh) is not here: it needs a spring-headless build,
  # a game and a map, none of which a runner has.
  lua:
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Lua tests
        run: scripts/mission-tests.sh

  # The Rust checks are two jobs, lint and test, which run side by side. Each
  # compiles different output (clippy metadata against test binaries), so each
  # keeps its own cache, keyed by job id.
  #
  # 30 minutes rather than the other jobs' limits: on a cache miss these jobs
  # build the Tauri app crate and the unitsync worker from cold, which is the
  # long tail of the workflow.
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # clippy must compile the Tauri crate before it can lint it, and rust-test
      # links it, so the same system libraries the release build needs are
      # required here too.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdevil-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri-build verifies that declared bundle resources exist. The mapconv
      # folder is normally fetched from a SpringMapConvNG release at build time
      # (gitignored, see release.yml); clippy only needs the path to exist, not
      # its contents, so an empty placeholder satisfies the check.
      - name: Placeholder mapconv resource dir
        run: mkdir -p src-tauri/mapconv
      # Same for the pr-downloader resource folder (assembled at build time from
      # the committed prebuilts, gitignored). Clippy only needs the path to exist.
      - name: Placeholder pr-downloader resource dir
        run: mkdir -p src-tauri/prdownloader
      # tauri-build also verifies the externalBin sidecars exist, and it fails
      # the build script with "resource path ... doesn't exist" when one is
      # missing for the host triple. uberstress and pr-downloader are committed
      # prebuilts, so they are already here. The unitsync worker and the relay
      # agent are our own crates (gitignored build artifacts) and have to be
      # built for the runner's triple before clippy compiles the app crate.
      # One cargo call plans both dependency graphs together, so shared deps
      # build once and the two crates compile in parallel instead of in turn.
      # --profile dev: nothing else in these jobs runs the release profile, and
      # the tests in rust-test run the unitsync worker straight out
      # of target/debug/, so a release build here would be both wasted and a
      # risk of a release binary landing on that debug path instead of a dev
      # one (issue #2807).
      - name: Build unitsync worker and relay agent sidecars
        run: bash scripts/build-sidecars.sh --profile dev coilbox-unitsync-worker coilbox-relay-agent
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Clippy compiles the #[cfg(test)] modules but never runs them, so a wrong
  # Rust test would otherwise pass forever. The setup steps match rust-lint's,
  # and the comments there explain them.
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdevil-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Placeholder mapconv resource dir
        run: mkdir -p src-tauri/mapconv
      - name: Placeholder pr-downloader resource dir
        run: mkdir -p src-tauri/prdownloader
      - name: Build unitsync worker and relay agent sidecars
        run: bash scripts/build-sidecars.sh --profile dev coilbox-unitsync-worker coilbox-relay-agent
      # nextest runs every test binary at once, where `cargo test` runs them
      # one after another. It does not run doctests, and CI skips them on
      # purpose: the workspace has none, and a doctest step spent 3m01s
      # rebuilding every crate to find that out. Locally, `cargo test
      # --workspace` still runs any doctest that gets added.
      - name: Cargo nextest
        run: cargo nextest run --workspace

  # The message for a missing WebView2 runtime is Win32 code that only compiles
  # on Windows, and none of the jobs above build the app there, so a compile
  # error in it would first show in a release. It lives in a crate of its own
  # (issue #4873) so this job builds just that crate, with no Tauri and no
  # sidecars.
  windows-webview2:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-webview2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy -p coilbox-webview2 --all-targets -- -D warnings
      - name: Test
        run: cargo test -p coilbox-webview2

  # Multiplayer on a compat mutator rests on every player writing the same
  # files (issue #4563). This builds the checked-in fixture game into a mutator
  # twice, from every manifest, compares the two builds file by file, and
  # uploads a SHA-256 per file. compat-builds-match then compares the three
  # lists, which catches an encoder or line ending difference between systems.
  #
  # It is a job of its own so a flaky platform shows as its own red check.
  # Only the compat crate and what it links are built: the app crate and its
  # sidecars are not, so there are no placeholder resource folders or sidecar
  # builds here. The Linux libraries are what linking the Tauri crate needs.
  # The cache has no entry from another job, so it cannot freeze on one.
  # A skipped compat-identical-builds skips compat-builds-match too.
  compat-identical-builds:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdevil-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the fixture twice and hash the files
        env:
          COILBOX_COMPAT_HASH_LIST: ${{ runner.temp }}/compat-hashes.txt
        run: cargo test -p tauri-plugin-coilbox-compat --lib identical_builds -- --nocapture
      - uses: actions/upload-artifact@v7
        with:
          name: compat-hashes-${{ matrix.os }}
          path: ${{ runner.temp }}/compat-hashes.txt
          if-no-files-found: error

  # Fails when the three lists differ, and names the lines that do.
  compat-builds-match:
    needs: compat-identical-builds
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-hashes-*
      - name: The lists match
        run: |
          set -eu
          test "$(ls -d compat-hashes-* | wc -l)" -eq 3
          test -s compat-hashes-ubuntu-22.04/compat-hashes.txt
          status=0
          for os in macos-latest windows-latest; do
            diff -u compat-hashes-ubuntu-22.04/compat-hashes.txt "compat-hashes-$os/compat-hashes.txt" || status=1
          done
          exit "$status"
