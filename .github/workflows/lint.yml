name: lint

# Lint and format checks for pull requests (and pushes to main). Covers both
# source surfaces: the TypeScript/React frontend (Biome + tsc) and the Rust
# workspace (rustfmt + clippy). No release concerns here — clippy compiles
# source but does not bundle, so the SpringMapConvNG sidecars and a built
# frontend (dist/) are not needed.

on:
  pull_request:
  push:
    branches: [main]

# Every job sets timeout-minutes. GitHub's default is six hours, and a runner
# that wedges on an apt install holds the pull request's checks pending for all
# of it. These limits are several times the observed run times, so a healthy but
# slow run still finishes while a stall turns red within the hour.

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Exact semver keeps setup-bun off api.github.com (see release.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome (lint + format check)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck

  # The mission runtime is Lua a game vendors, so neither the frontend nor the
  # Rust job compiles it and a break in it would otherwise reach a game. The
  # suites need luajit and nothing else. The engine harness
  # (scripts/mission-headless.sh) is not here: it needs a spring-headless build,
  # a game and a map, none of which a runner has.
  lua:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Mission runtime tests
        run: scripts/mission-tests.sh

  # 30 minutes rather than the other two jobs' limits: on a cache miss this job
  # builds the Tauri app crate and the unitsync worker from cold, which is the
  # long tail of the workflow.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # clippy must compile the Tauri crate before it can lint it, and the test
      # step links it, so the same system libraries the release build needs are
      # required here too.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdevil-dev
      - uses: Swatinem/rust-cache@v2
      # tauri-build verifies that declared bundle resources exist. The mapconv
      # folder is normally fetched from a SpringMapConvNG release at build time
      # (gitignored, see release.yml); clippy only needs the path to exist, not
      # its contents, so an empty placeholder satisfies the check.
      - name: Placeholder mapconv resource dir
        run: mkdir -p src-tauri/mapconv
      # Same for the pr-downloader resource folder (assembled at build time from
      # the committed prebuilts, gitignored). Clippy only needs the path to exist.
      - name: Placeholder pr-downloader resource dir
        run: mkdir -p src-tauri/prdownloader
      # tauri-build also verifies the externalBin sidecars exist. The unitsync
      # worker is our own crate (gitignored build artifact), so build it for the
      # runner's triple before clippy compiles the app crate.
      - name: Build unitsync worker sidecar
        run: bash scripts/build-unitsync-worker.sh
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Clippy compiles the #[cfg(test)] modules but never runs them, so a wrong
      # Rust test would otherwise pass forever. Shares this job's toolchain,
      # cache and the three prerequisites above rather than paying for them
      # twice in a job of its own.
      - name: Cargo test
        run: cargo test --workspace
