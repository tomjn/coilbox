name: Deploy docs site

# Build the VitePress docs site (issue #168) and publish it to GitHub Pages on
# every push to main. Kept separate from the Tauri app build/release workflows.
on:
  push:
    branches: [main]
    # Only rebuild when the site or its sources change. The art files are in
    # that list because the site imports its page backdrops straight out of the
    # app rather than keeping a copy (see docs/.vitepress/theme/backdrops.ts),
    # so a change to a drawing changes the site.
    paths:
      - "docs/**"
      - "src/home/bundledArt.ts"
      - "src/home/proceduralArt.ts"
      - "src/conquest/rng.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege token for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact semver keeps setup-bun off api.github.com (see release.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build docs site
        run: bun run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
