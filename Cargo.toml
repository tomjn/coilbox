# Line tables rather than full debug info. A backtrace or a panic still names
# the file and the line, which is what anyone reads here. What goes is the
# variable-level information only a debugger uses. Across 33 crates, and with
# `--all-targets` building every test binary as well, that information was the
# bulk of a target directory that reached 42 GiB and filled the disk.
#
# Incremental compilation stays on. It costs disk but keeps the edit-and-check
# loop short, which matters more day to day. Note that sccache cannot cache an
# incremental build, so the two do not combine.
#
# `split-debuginfo` is deliberately not set. It moves debug info between the
# binary, .o files and a .dSYM bundle, and changes link times, but it does not
# reduce how much debug info exists. The level does that.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
# SHA-256 is where a render key spends its time, and every `source_hash` coilbox
# uploads goes through it too, so the five members that hash share one
# declaration rather than five that can drift apart (issue #1751).
#
# 0.11 compiles both the aarch64 and the x86 hardware backend and picks between
# them and the portable code at runtime through cpufeatures. 0.10 only did that
# on x86: aarch64 needed the `asm` feature, which pulled in sha2-asm, whose
# GNU-syntax .S sources cl.exe will not assemble (RustCrypto/asm-hashes#17), so
# each of these five crates carried a second declaration guarded on
# `cfg(all(target_arch = "aarch64", not(target_env = "msvc")))` and windows-arm64
# was left on the portable code. None of that is needed here (issue #1757).
sha2 = "0.11"

# One derive implementation shared by the 25 manifests that serialise config,
# catalog and protocol types, instead of 25 declarations that can drift apart.
serde = { version = "1", features = ["derive"] }

# The JSON encoder/decoder every crate above uses alongside serde, and two more
# besides (a build-dependency and one with no serde derive of its own).
serde_json = "1"

# One throwaway-directory implementation for the 12 crates whose tests (and, in
# two cases, runtime code) need a real filesystem location that isn't anyone's.
tempfile = "3"

# One codec for the tokens, hashes and other binary-to-text values that cross a
# protocol or config boundary, shared by 9 crates instead of copied into each.
base64 = "0.22"

# The .sdz/.zip reader content, mapconv and scenario all use, pinned once
# instead of three times.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# The .sd7/7z reader downloads, mapconv and scenario all use, pinned once
# instead of three times.
sevenz-rust2 = "0.21.1"

# The decoder/encoder backend shared by six crates. Each enables a different
# subset of formats for its own reason (see the comment at each call site), so
# only the version and default-features toggle are shared here. Features stay
# declared per crate.
image = { version = "0.25", default-features = false }

# The HTTP client the five crates that talk to a network service share. It was
# left out of #2438 because it needed a version bump first: we were on 0.12 and
# tauri-plugin-updater 2.10 moved to 0.13, so the binary linked both majors
# (issue #2489). One declaration here, so the next bump is one edit.
#
# `rustls-no-provider` rather than `rustls`. 0.13 made rustls the default TLS
# backend and, with it, aws-lc-rs the default crypto provider. The updater sets
# `reqwest/rustls-no-provider` and installs `ring` as the process default, so
# taking 0.13's own default here would compile both providers into the binary
# instead of the one it has today. `rustls-no-provider` leaves the choice to
# whoever installs the process default, and every client constructor in these
# five crates calls `use_ring_provider` first to make that ring. reqwest panics
# when building a client if nothing has installed one.
#
# Roots do change: 0.12's `rustls-tls` bundled the Mozilla set through
# webpki-roots, 0.13 removed the roots features and verifies against the
# platform trust store through rustls-platform-verifier. That is the same
# verifier the updater already uses, and it means a machine-wide trust decision
# (a corporate root, a revoked CA) now applies to our requests too.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }

# One rustls crypto provider for the whole binary. Only the crates that build a
# reqwest client need this, to install ring as the process default before they
# do. See the reqwest comment above.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# russimp-sys cannot be built from crates.io at all: the published package ships
# `assimp/include` and no CMakeLists.txt, so its build script panics looking for
# the source it means to compile. The git tree carries Assimp as a submodule and
# builds, so the dependency comes from there, pinned to an exact commit.
#
# Building it also needs `CFLAGS=-Dfdopen=fdopen` on macOS. Assimp 5.3.0 vendors
# zlib 1.2.13, whose zutil.h still has a branch for pre-OS X Macs guarded on
# `TARGET_OS_MAC`, which every modern Mac defines. That branch defines `fdopen`
# away and breaks the SDK's own declaration of it. The flag makes zlib's
# `#ifndef fdopen` guard skip the bad define.
[patch.crates-io]
russimp-sys = { git = "https://github.com/jkvargas/russimp-sys", rev = "3ec28662fc23288d19c2f8e6796d060083868e4d" }
