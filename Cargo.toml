  "crates/coilbox-springlua",
  "crates/coilbox-unitpose",
  "crates/coilbox-assets",
  "crates/coilbox-map-catalog",
  "crates/coilbox-thumb-cache",
  "crates/coilbox-texture",
  "crates/coilbox-unitsync-worker",
  "crates/coilbox-relay-protocol",
  "crates/coilbox-relay-agent",
  "crates/coilbox-oauth",
  "crates/tauri-plugin-coilbox-downloads",
  "crates/tauri-plugin-coilbox-uberstress",
  "crates/tauri-plugin-coilbox-mapconv",
  "crates/tauri-plugin-coilbox-anim",
