  "crates/coilbox-3do-convert",
  "crates/coilbox-lobby-protocol",
  "crates/coilbox-tachyon-protocol",
  "crates/coilbox-zerok-protocol",
  "crates/coilbox-springlua",
  "crates/coilbox-bos2lua",
  "crates/coilbox-unitpose",
  "crates/coilbox-assets",
  "crates/coilbox-map-catalog",
  "crates/coilbox-thumb-cache",
  "crates/coilbox-texture",
  "crates/coilbox-unitsync-worker",
  "crates/coilbox-relay-protocol",
  "crates/coilbox-relay-agent",
  "crates/coilbox-oauth",
  "crates/tauri-plugin-coilbox-downloads",
  "crates/tauri-plugin-coilbox-uberstress",
  "crates/tauri-plugin-coilbox-mapconv",
  "crates/tauri-plugin-coilbox-anim",
  "crates/tauri-plugin-coilbox-content",
  "crates/tauri-plugin-coilbox-play",
  "crates/tauri-plugin-coilbox-campaign",
  "crates/tauri-plugin-coilbox-scenario",
  "crates/tauri-plugin-coilbox-lego",
  "crates/tauri-plugin-coilbox-workshop",
  "crates/tauri-plugin-coilbox-conquest",
  "crates/tauri-plugin-coilbox-runlite",
  "crates/tauri-plugin-coilbox-profile",
  "crates/tauri-plugin-coilbox-lobby-servers",
  "crates/tauri-plugin-coilbox-hub",
  "crates/tauri-plugin-coilbox-multiplayer",
  "crates/tauri-plugin-coilbox-direct",
