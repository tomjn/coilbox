[workspace.dependencies]
# SHA-256 is where a render key spends its time, and every `source_hash` coilbox
# uploads goes through it too, so the five members that hash share one
# declaration rather than five that can drift apart (issue #1751).
#
# 0.11 compiles both the aarch64 and the x86 hardware backend and picks between
# them and the portable code at runtime through cpufeatures. 0.10 only did that
# on x86: aarch64 needed the `asm` feature, which pulled in sha2-asm, whose
# GNU-syntax .S sources cl.exe will not assemble (RustCrypto/asm-hashes#17), so
# each of these five crates carried a second declaration guarded on
# `cfg(all(target_arch = "aarch64", not(target_env = "msvc")))` and windows-arm64
# was left on the portable code. None of that is needed here (issue #1757).
sha2 = "0.11"
