[package]
name = "tauri-plugin-coilbox-lego"
version = "0.0.0"
description = "Unit builder storage plugin for Coilbox (Rust half): stores lego unit projects, reusable compounds and their thumbnails. ACL identifier: coilbox-lego"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-lego`.
links = "tauri-plugin-coilbox-lego"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-s3o = { path = "../coilbox-s3o" }
# The older model format, which most of an older game's roster is drawn with.
coilbox-3do = { path = "../coilbox-3do" }
# Playing a unit's own script in the viewport: the runtime lives beside the
# config evaluator, in the crate that already carries Lua.
coilbox-springlua = { path = "../coilbox-springlua" }
# Imported geometry ships gzipped, the same as the parts pack's blob, which the
# frontend already inflates with fflate.
flate2 = "1"
# The texture store is keyed by content, so a file edited outside coilbox hashes
# to a new key and cannot be served from a stale cache.
sha2 = { workspace = true }
# A webview renders none of `.bmp`, `.tga` or `.tif`, and they are most of what
# the legacy games ship, so all three are re-encoded to PNG on the way into the
# store. `coilbox-texture` does the decoding. These are the encoders the tests
# write their fixtures with.
image = { version = "0.25", default-features = false, features = [
  "png",
  "bmp",
  "tga",
  "tiff",
] }
# Blender reads neither a `.dds` nor a compressed texture inside a `.glb`, so the
# two Blender exports decode whatever the store holds and write a PNG. The same
# decode the unitsync worker's build pics go through (issue #715).
coilbox-texture = { path = "../coilbox-texture" }

[dev-dependencies]
tempfile = "3"
