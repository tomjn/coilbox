"$schema" = "schemas/schema.json"

[default]
description = "Allows the play plugin's start-script generation, engine launch and cancel commands."
permissions = [
  "allow-play-generate-script",
  "allow-play-export-script",
  "allow-play-export-preset",
  "allow-play-import-preset",
  "allow-play-launch",
  "allow-play-launch-replay",
  "allow-play-launch-save",
  "allow-play-cancel",
  "allow-play-focus",
]
