"$schema" = "schemas/schema.json"

[default]
description = "Allows the play plugin's start-script generation, engine launch and cancel commands."
permissions = [
  "allow-play-generate-script",
  "allow-play-export-script",
  "allow-play-export-preset",
  "allow-play-import-preset",
  "allow-play-chobby-presets-find",
  "allow-play-chobby-presets-read",
  "allow-play-chobby-presets-write",
  "allow-play-launch",
  "allow-play-launch-replay",
  "allow-play-launch-save",
  "allow-play-cancel",
  "allow-play-ask-lua-rules",
  "allow-play-focus",
  "allow-play-infolog",
  "allow-play-system-info",
]
