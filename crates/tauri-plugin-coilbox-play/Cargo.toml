[package]
name = "tauri-plugin-coilbox-play"
version = "0.0.0"
description = "Singleplayer/skirmish launcher plugin for Coilbox (Rust half). ACL identifier: coilbox-play"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-play`.
links = "tauri-plugin-coilbox-play"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-proc = { path = "../coilbox-proc" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
