[package]
name = "coilbox-compat"
version = "0.0.0"
description = "The compatibility fixes and the manifests that say which of them make up each compat version, embedded so a build needs no files at run time."
edition = "2021"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Loads the built prelude in the same sandboxed Lua 5.1 the app evaluates game
# Lua in, to check it runs and defines what it says.
coilbox-springlua = { path = "../coilbox-springlua" }
tempfile = { workspace = true }
# Reads a real game's entry files out of its archive for the ignored test.
zip = { workspace = true }
# Reads the call-in handlers a game's Lua defines, as the mutator build does.
coilbox-luacompat = { path = "../coilbox-luacompat" }
