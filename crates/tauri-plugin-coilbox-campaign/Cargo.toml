[package]
name = "tauri-plugin-coilbox-campaign"
version = "0.0.0"
description = "Campaign storage plugin for Coilbox (Rust half): stores authored skirmish-mission campaigns, imported panorama art and player progress. ACL identifier: coilbox-campaign"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-campaign`.
links = "tauri-plugin-coilbox-campaign"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
uuid = { version = "1", features = ["v4"] }
image = { workspace = true, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
] }

[dev-dependencies]
tempfile = { workspace = true }
