"$schema" = "schemas/schema.json"

[default]
description = "Allows the conquest plugin's galaxy storage, run-state and hand-made map commands."
permissions = [
  "allow-conquest-list",
  "allow-conquest-save",
  "allow-conquest-delete",
  "allow-conquest-state-load",
  "allow-conquest-state-save",
  "allow-conquest-map-list",
  "allow-conquest-map-stage",
  "allow-conquest-map-commit",
  "allow-conquest-map-discard",
  "allow-conquest-map-remove",
]
