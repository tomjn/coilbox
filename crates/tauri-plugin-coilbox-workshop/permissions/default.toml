"$schema" = "schemas/schema.json"

[default]
description = "Allows the workshop plugin's compiler, preflight check, local test launch, packaging and BAR tweak-slot export. The compiler and preflight check turn a saved tweak project into the Lua a game reads and read nothing and write nothing; the test launch writes a generated game under the content root's games/ (issue #1278); packaging writes a versioned .sdz to a caller-chosen path (issue #1283); the BAR export packs compiled chunks across Beyond All Reason's numbered tweak slots and reads and writes nothing (issue #1277)."
permissions = [
  "allow-workshop-compile",
  "allow-workshop-preflight",
  "allow-workshop-test-mutator",
  "allow-workshop-package-mutator",
  "allow-workshop-pack-bar-slots",
]
