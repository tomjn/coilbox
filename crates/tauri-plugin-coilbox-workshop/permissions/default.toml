"$schema" = "schemas/schema.json"

[default]
description = "Allows the workshop plugin's compiler, preflight check, local test launch and packaging. The compiler and preflight check turn a saved tweak project into the Lua a game reads and read nothing and write nothing; the test launch writes a generated game under the content root's games/ (issue #1278); packaging writes a versioned .sdz to a caller-chosen path (issue #1283)."
permissions = [
  "allow-workshop-compile",
  "allow-workshop-preflight",
  "allow-workshop-test-mutator",
  "allow-workshop-package-mutator",
]
