[package]
name = "tauri-plugin-coilbox-workshop"
version = "0.0.0"
description = "Compiles a workshop mod project into the Lua a Spring game reads. ACL identifier: coilbox-workshop"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-workshop`.
links = "tauri-plugin-coilbox-workshop"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
# The syntax half of the preflight check (issue #1276): runs generated Lua
# through a real Lua 5.1 VM so a check can say what the Lua does rather than
# what it looks like. Was a dev-dependency only, for the integration tests
# that run the generated blocks the same way. `workshop_preflight` now calls
# it at runtime too.
coilbox-springlua = { path = "../coilbox-springlua" }
# The codec issue #1277's BAR export will encode a slot's payload with. The
# preflight check proves a chunk survives that same round trip before #1277
# exists to produce the real payload.
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
