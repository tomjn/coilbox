[package]
name = "coilbox-relay-agent"
version = "0.0.0"
description = "Sidecar that fans a relayed battle out into one loopback UDP socket per player, so the host engine tells them apart by source port the way it would tell apart N real clients. Runs out of process because the engine outlives coilbox and a relay that dies with the window would strand a game."
edition = "2021"
license = "MIT"

[[bin]]
name = "coilbox-relay-agent"
path = "src/main.rs"

[dependencies]
# The control channel's message shapes, shared with the coilbox end so a change
# to either breaks both builds rather than one of them at runtime. IO-free and
# tokio-free on purpose, so the coilbox end can depend on it without inheriting
# everything below.
coilbox-relay-protocol = { path = "../coilbox-relay-protocol" }

# What `turn` buys is the long-term credential dance nobody wants to write
# twice: answer the server's 401 challenge, derive a key from the credential
# and the challenge, sign every request after that with HMAC-SHA1, then keep
# Allocate, Refresh, CreatePermission and ChannelBind in step with each other.
# Ten packages land in `Cargo.lock` for it (`turn`, `stun`, `webrtc-util`,
# `nix`, `memoffset`, `crc`, `crc-catalog`, `lazy_static`, `pin-utils`,
# `portable-atomic`). Everything else in its tree was already here.
#
# It also happens to fit: `Client::allocate` hands back a `webrtc_util::Conn`,
# whose `recv_from` returns `(usize, SocketAddr)`, which is exactly the pair
# `crate::demux` keys peers on. `crate::relay::RelayLink` was shaped around
# that on purpose.
turn = "0.17.2"

# Both arrive inside `turn`'s tree, so naming them directly costs nothing and
# saves reaching through a private module. `webrtc-util` for the `Conn` trait
# the TURN client takes its socket as, and `async-trait` because that trait is
# written with it. `stun` to read the server's answers off the wire in
# `crate::allocation`.
async-trait = "0.1"
stun = "0.17"
webrtc-util = { version = "0.17", default-features = false, features = ["conn"] }

# The whole crate is one socket fanned out into many, so it is tokio and
# nothing else. `net` for the sockets, `sync` for the one channel that carries
# engine replies back up to the relay, `time` for the clock the allocation is
# judged alive against, `rt-multi-thread` + `macros` for the runtime the binary
# starts, and `io-std` + `io-util` for the stdin and stdout the control channel
# runs over.
tokio = { version = "1", features = [
    "net",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
] }

[dev-dependencies]
# `test-util` so the allocation tests can wind the clock past a lifetime
# instead of waiting one out, and so the loopback tests fail loudly on a
# timeout rather than hanging when a datagram never arrives.
tokio = { version = "1", features = ["time", "test-util"] }
