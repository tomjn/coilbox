[package]
name = "tauri-plugin-coilbox-hub"
version = "0.0.0"
description = "Coilbox hub account (Rust half): the Discord sign-in through the hub's Supabase project, and the access token it hands out. ACL identifier: coilbox-hub"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this name
# with the `tauri-plugin-` prefix stripped -> `coilbox-hub`.
links = "tauri-plugin-coilbox-hub"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
picoframe-core = "0.0.4"
coilbox-oauth = { path = "../coilbox-oauth" }
# The variant names the have check's keys are built from, read from the same
# shared/asset-vocabulary.json the hub agrees to.
coilbox-assets = { path = "../coilbox-assets" }
# The map catalog entry's shape and the request caps the hub refuses at, read
# from the same shared document the hub vendors (issue #1736).
coilbox-map-catalog = { path = "../coilbox-map-catalog" }
# The settings file and the portable root, so the upload consent check reads the
# user's answer and the distribution profile off disk rather than being told.
coilbox-portable = { path = "../coilbox-portable" }
tauri-plugin-opener = "2"
# rustls-tls keeps OpenSSL out of the build, the same reason the downloads plugin
# picks it. `multipart` is the upload route's body shape (issue #1633): a JSON
# declaration beside the encoded bytes, neither of which belongs inside the other.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "multipart",
] }
url = "2"
# The timer and the select that race a cancel flag against a request in flight.
# Already compiled here through coilbox-oauth, so nothing new is built.
tokio = { version = "1", features = ["macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
