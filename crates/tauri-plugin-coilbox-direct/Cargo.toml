[package]
name = "tauri-plugin-coilbox-direct"
version = "0.0.0"
description = "Direct and LAN hosting (Rust half): a TASServer subset the host runs in process, so a battle needs no lobby server. ACL identifier: coilbox-direct"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this name
# with the `tauri-plugin-` prefix stripped -> `coilbox-direct`.
links = "tauri-plugin-coilbox-direct"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# A runtime of their own, and a clock the idle-peer test can wind forward
# rather than waiting out the real ninety seconds.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "test-util"] }
# `tauri::test::mock_builder`, so the quit handler can be driven through a real
# `RunEvent::Exit` instead of being called by hand. `test` is an empty feature
# list in tauri's manifest, so it adds no package to `Cargo.lock`, and asking
# for it here rather than in `[dependencies]` keeps the mock runtime out of the
# app anybody ships.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-lobby-protocol = { path = "../coilbox-lobby-protocol" }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
# Address reuse and the multicast options, which std's UdpSocket does not expose.
# Two coilboxes on one machine have to be able to bind the beacon port at once.
socket2 = { version = "0.6", features = ["all"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Asking a router to open a port. Two protocols because a home router speaks
# one, the other, both or neither.
igd-next = { version = "0.17.1", default-features = false, features = ["aio_tokio"] }
crab_nat = "0.8.1"
# The other half of the same question: what the internet sees, in `stun.rs`.
# This was hand rolled while the argument against a crate held, which was that
# every STUN crate carries ICE and TURN machinery none of this uses. The relay
# agent's `turn` dependency brought `stun` into `Cargo.lock` regardless, so the
# machinery is in the build either way and the choice is now between one STUN
# implementation and two.
stun = "0.17"
# The OS's interface list, with a netmask on every address and the default
# gateway beside it. The beacon needs the netmask to address a broadcast to the
# subnet it is leaving by, and port mapping needs the gateway to speak NAT-PMP
# to, and both are per platform work: this is one crate for the two of them.
netdev = "0.46.0"
mdns-sd = "0.21.0"
