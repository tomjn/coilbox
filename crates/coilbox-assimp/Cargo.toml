[package]
name = "coilbox-assimp"
version = "0.0.0"
description = "Reader for the five model formats Spring/Recoil loads through Assimp: .dae, .obj, .3ds, .lwo and .blend. Read only, and the caller passes the bytes because a game's models sit inside a packed archive."
edition = "2021"
license = "MIT"

[dependencies]
# Static, so the worker sidecar carries Assimp rather than asking the machine it
# runs on for a copy. `build-assimp` compiles the source inside the published
# package, so the build downloads nothing. See `.cargo/config.toml` for what a
# Homebrew minizip would otherwise do to that build.
asset-importer = { version = "0.8.0", features = ["build-assimp", "static-link"] }
