[package]
name = "coilbox-proc"
version = "0.0.0"
description = "Child-process helpers shared by every plugin that shells out: a Command constructor that suppresses the console window Windows pops for console-mode sidecars, and a liveness check for a process we did not spawn."
edition = "2021"
license = "MIT"

[dependencies]

# Only for `is_running`, which asks the OS about a process this one did not
# spawn and so has no `Child` for. Neither adds a crate to the build: `libc`
# arrives under tokio, and `windows-sys` 0.61 arrives under tauri, mio and
# socket2. The higher-level `windows` crate would, because Tauri pins 0.61 of
# that one and we wanted 0.62, so a Windows build compiled both (issue #2808).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
