[package]
name = "tauri-plugin-coilbox-unitsync"
version = "0.0.0"
description = "unitsync content-scan plugin for Coilbox (Rust half): spawns the coilbox-unitsync-worker sidecar to read maps/games/archives. ACL identifier: coilbox-unitsync"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-unitsync`.
links = "tauri-plugin-coilbox-unitsync"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-proc = { path = "../coilbox-proc" }
coilbox-thumb-cache = { path = "../coilbox-thumb-cache" }
# The `Mode`/`UnitRenderArgs` contract the worker's `parse_args` also builds
# from, so a migrated mode's flags are defined once rather than written by
# hand here and in the worker's `main.rs` (issue #2448).
coilbox-unitsync-worker = { path = "../coilbox-unitsync-worker" }

[dev-dependencies]
tempfile = { workspace = true }
