[package]
name = "coilbox-3do-convert"
version = "0.1.0"
description = "Turns a Total Annihilation `.3do` into a Spring `.s3o`: packs the tiles it names into one sheet, gives every face real coordinates onto it, and records where each tile landed so a later conversion can share the sheet."
edition = "2021"
license = "MIT"

[dependencies]
# The two model formats this sits between. Both are dependency-free readers, and
# `coilbox-s3o` carries the writer this hands its output to.
coilbox-3do = { path = "../coilbox-3do" }
coilbox-s3o = { path = "../coilbox-s3o" }
# The sheet is drawn pixel by pixel. A caller decodes its own tiles, so nothing
# here reads or writes a file. PNG only to encode the finished sheet, whose bytes
# a compat manifest's pin on this crate covers (issue #4557).
image = { workspace = true, features = ["png"] }
# The sidecar that records where every tile landed.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Hashes the output of a fixed conversion, so a change to it fails a test and
# the version above moves with it.
sha2 = { workspace = true }
