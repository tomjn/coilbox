"$schema" = "schemas/schema.json"

[default]
description = "Allows the content plugin's commands (detect candidates, load/rescan state, scan/add/remove roots, list/verify engines)."
permissions = [
  "allow-content-candidates",
  "allow-content-state-load",
  "allow-content-rescan",
  "allow-content-scan-root",
  "allow-content-add-root",
  "allow-content-create-standard-root",
  "allow-content-recreate-root",
  "allow-content-remove-root",
  "allow-content-list-engines",
  "allow-content-verify-engine",
  "allow-content-open-path",
  "allow-content-list-replays",
  "allow-content-demo-info",
  "allow-content-demo-chat",
  "allow-content-config-profiles",
  "allow-content-config-backup",
  "allow-content-config-restore",
  "allow-content-config-delete-profile",
  "allow-branding-catalog",
  "allow-branding-image",
]
