[package]
name = "tauri-plugin-coilbox-content"
version = "0.0.0"
description = "Content discovery plugin for Coilbox (Rust half): finds Spring/Recoil engines and data roots. ACL identifier: coilbox-content"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-content`.
links = "tauri-plugin-coilbox-content"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-proc = { path = "../coilbox-proc" }
# The backup-before-write helpers the .3do installer shares with the
# workshop's edit-in-place route (issue #2635).
coilbox-gamebackup = { path = "../coilbox-gamebackup" }
# Reads and edits an `.fbi` unit definition's objectname (issue #2630).
coilbox-tdf = { path = "../coilbox-tdf" }
flate2 = "1"
notify = "8"
zip = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { workspace = true, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
] }

[dev-dependencies]
# Backdating a fixture game's mtime in the issue #3025 tests, so the
# install/undo's own touch has something older to move away from.
filetime = "0.2"
