[package]
name = "tauri-plugin-coilbox-content"
version = "0.0.0"
description = "Content discovery plugin for Coilbox (Rust half): finds Spring/Recoil engines and data roots. ACL identifier: coilbox-content"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-content`.
links = "tauri-plugin-coilbox-content"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-proc = { path = "../coilbox-proc" }
# The backup-before-write helpers the .3do installer shares with the
# workshop's edit-in-place route (issue #2635).
coilbox-gamebackup = { path = "../coilbox-gamebackup" }
# Reads and edits an `.fbi` unit definition's objectname (issue #2630).
coilbox-tdf = { path = "../coilbox-tdf" }
# The writer the scenario test mutator uses for a generated game, which the
# replay analysis game is written with too (issue #1183).
tauri-plugin-coilbox-scenario = { path = "../tauri-plugin-coilbox-scenario" }
# Launches the playback game through the play plugin's run registry, so a second
# game cannot start over a running one (issue #3793).
tauri-plugin-coilbox-play = { path = "../tauri-plugin-coilbox-play" }
# Reads the short name of the game an analysis depends on (issue #3943).
tauri-plugin-coilbox-unitsync = { path = "../tauri-plugin-coilbox-unitsync" }
# Reads the data half of a game's playback adapter, which is Lua (issue #3799).
coilbox-springlua = { path = "../coilbox-springlua" }
# Reads a track's header, and says which recorder version is current, for the
# replay track store (issue #3786).
coilbox-track = { path = "../coilbox-track" }
coilbox-track-thin = { path = "../coilbox-track-thin" }
flate2 = "1"
# Names a stored unit definition list by its content (issue #1176), as the map
# catalog and the asset vocabulary name theirs.
sha2 = { workspace = true }
notify = "8"
zip = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { workspace = true, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
] }

[dev-dependencies]
tempfile = { workspace = true }
# Backdating a fixture game's mtime in the issue #3025 tests, so the
# install/undo's own touch has something older to move away from.
filetime = "0.2"
