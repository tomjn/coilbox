[package]
name = "coilbox-zerok-protocol"
version = "0.0.0"
description = "Pure, IO-free Zero-K lobby protocol types: the vendored C# definitions, the Rust types generated from them, and the command dispatch. No Tauri, no tokio, no socket."
edition = "2021"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
prettyplease = "0.2"
syn = "2"
