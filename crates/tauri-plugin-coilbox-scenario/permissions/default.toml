"$schema" = "schemas/schema.json"

[default]
description = "Allows the scenario plugin's storage, dialogue-media, file export and import, compiled-mission read-back, write, list and remove, mission-runtime install and test-mutator commands."
permissions = [
  "allow-scenario-list",
  "allow-scenario-save",
  "allow-scenario-delete",
  "allow-scenario-media-import",
  "allow-scenario-media-delete",
  "allow-scenario-media-sweep",
  "allow-scenario-media-read",
  "allow-scenario-media-write",
  "allow-scenario-export",
  "allow-scenario-import",
  "allow-scenario-read-mission",
  "allow-scenario-runtime-install",
  "allow-scenario-runtime-consolidate",
  "allow-scenario-runtime-status",
  "allow-scenario-list-missions",
  "allow-scenario-delete-mission",
  "allow-scenario-test-mutator",
  "allow-scenario-write-mission",
]
