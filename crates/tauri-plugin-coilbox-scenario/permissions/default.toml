"$schema" = "schemas/schema.json"

[default]
description = "Allows the scenario plugin's storage, dialogue-media, compiled-mission read-back and mission-runtime install commands."
permissions = [
  "allow-scenario-list",
  "allow-scenario-save",
  "allow-scenario-delete",
  "allow-scenario-media-import",
  "allow-scenario-media-delete",
  "allow-scenario-media-read",
  "allow-scenario-media-write",
  "allow-scenario-read-mission",
  "allow-scenario-runtime-install",
  "allow-scenario-runtime-status",
]
