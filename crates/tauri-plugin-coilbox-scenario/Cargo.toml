[package]
name = "tauri-plugin-coilbox-scenario"
version = "0.0.0"
description = "Scenario storage plugin for Coilbox (Rust half): stores authored mission scenarios and the portrait/audio clips their dialogue plays. ACL identifier: coilbox-scenario"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-scenario`.
links = "tauri-plugin-coilbox-scenario"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
base64 = { workspace = true }
tauri = { version = "2" }
serde = { workspace = true }
serde_json = { workspace = true }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-springlua = { path = "../coilbox-springlua" }
uuid = { version = "1", features = ["v4"] }
# Reading a game's own missions out of the archive it ships them in. `.sdz` is a
# zip and `.sd7` is 7-zip, the same two readers content and mapconv already use.
zip = { workspace = true }
sevenz-rust2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
