[package]
name = "tauri-plugin-coilbox-scenario"
version = "0.0.0"
description = "Scenario storage plugin for Coilbox (Rust half): stores authored mission scenarios and the portrait/audio clips their dialogue plays. ACL identifier: coilbox-scenario"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-scenario`.
links = "tauri-plugin-coilbox-scenario"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
