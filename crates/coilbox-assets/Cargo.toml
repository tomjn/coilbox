[package]
name = "coilbox-assets"
version = "0.0.0"
description = "The variant names, encode profiles and dimension caps coilbox and the hub have to agree on, read from the same shared/asset-vocabulary.json the frontend imports."
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The digest of the embedded document, so a client can be told it is behind the
# hub instead of finding out one refusal at a time (issue #1708). Already the
# version four other crates here build.
sha2 = { workspace = true }

# The hardware SHA-256 backend, which is a feature on aarch64 and automatic
# everywhere else. The workspace root says why the block is shaped this way.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
