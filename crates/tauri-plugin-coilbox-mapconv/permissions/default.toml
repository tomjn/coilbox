"$schema" = "schemas/schema.json"

[default]
description = "Allows the mapconv plugin's commands (probe, suggest-sources, compile, decompile, cancel)."
permissions = [
  "allow-mc-probe",
  "allow-mc-suggest-sources",
  "allow-mc-read-mapinfo",
  "allow-mc-read-skybox",
  "allow-mc-image-info",
  "allow-mc-height-field",
  "allow-mc-smf-heights",
  "allow-mc-compile",
  "allow-mc-write-mapinfo",
  "allow-mc-package-map",
  "allow-mc-install-map",
  "allow-mc-decompile",
  "allow-mc-cancel",
  "allow-mc-open-path",
  "allow-mc-open-url",
]
