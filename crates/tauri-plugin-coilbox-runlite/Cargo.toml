[package]
name = "tauri-plugin-coilbox-runlite"
version = "0.0.0"
description = "Single-player roguelite-run storage plugin for Coilbox (Rust half): stores the active run and persistent meta-progression as opaque JSON. ACL identifier: coilbox-runlite"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-runlite`.
links = "tauri-plugin-coilbox-runlite"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
