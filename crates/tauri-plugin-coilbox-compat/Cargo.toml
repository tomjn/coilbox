[package]
name = "tauri-plugin-coilbox-compat"
version = "0.0.0"
description = "Writes the compatibility mode mutator that wraps an old game for a current engine, and says when it is stale. ACL identifier: coilbox-compat"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `coilbox-compat`.
links = "tauri-plugin-coilbox-compat"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
picoframe-core = "0.0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# The manifests that say what each compat version holds.
coilbox-compat = { path = "../coilbox-compat" }
# Its version, which a manifest pins.
coilbox-3do-convert = { path = "../coilbox-3do-convert" }
# `refuse_in_bundle`, so a distribution's bundled content is never written into.
coilbox-portable = { path = "../coilbox-portable" }
# `write_mutator` and `lua_string`, the writers the workshop test mutator uses.
tauri-plugin-coilbox-workshop = { path = "../tauri-plugin-coilbox-workshop" }
# Reads the base game's Lua entry files to wrap them with the prelude, converts
# its 3do models, and runs the worker scan the test that the mutator is listed
# reads.
tauri-plugin-coilbox-unitsync = { path = "../tauri-plugin-coilbox-unitsync" }
# The hits the Lua compat scan reports, which name the call-in handlers a game
# defines, so the mutator gets only the call-in adapters the game needs.
coilbox-luacompat = { path = "../coilbox-luacompat" }
# The folder the converter writes into before it is copied into the mutator.
tempfile = { workspace = true }

[dev-dependencies]
# Evaluates the written modinfo.lua the way the engine reads it.
coilbox-springlua = { path = "../coilbox-springlua" }
# Hashes the files a fixed build writes, so a change to them fails a test until
# the compat writer moves (issue #4629).
sha2 = { workspace = true }
# The converter crates the identical builds test (issue #4563) runs on its
# fixture model, in place of the worker, which needs unitsync.
coilbox-3do = { path = "../coilbox-3do" }
coilbox-s3o = { path = "../coilbox-s3o" }
# Reads the exported archive back, to check its files and their order.
zip = { workspace = true }
