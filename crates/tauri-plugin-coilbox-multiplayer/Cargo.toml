[package]
name = "tauri-plugin-coilbox-multiplayer"
version = "0.0.0"
description = "Live lobby client (Rust half): tokio socket, TLS/STLS, login state machine, and Channel event streaming driving the coilbox-lobby-protocol engine. ACL identifier: coilbox-multiplayer"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this name
# with the `tauri-plugin-` prefix stripped -> `coilbox-multiplayer`.
links = "tauri-plugin-coilbox-multiplayer"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# Paused time, so the test for the request timeout does not wait out the real
# fifteen seconds.
tokio = { version = "1", features = ["test-util"] }
# The room this client can be pointed at when nobody is running a lobby server.
# A dev dependency only: nothing in this crate's build depends on it.
tauri-plugin-coilbox-direct = { path = "../tauri-plugin-coilbox-direct" }
# A directory to write a relay agent's run file into that is not somebody's
# real one.
tempfile = "3"
# Minting the time limited credential that `tests/relayed_battle.rs` hands a
# real coturn: the TURN REST API password is the base64 of an HMAC-SHA1 over
# the username, and the username carries the expiry. Both of these are already
# in `Cargo.lock` at these versions, `ring` under `stun` and `rustls` and
# `base64` under `stun`, so neither adds a package to the tree.
ring = "0.17"
base64 = "0.22"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-lobby-protocol = { path = "../coilbox-lobby-protocol" }
coilbox-tachyon-protocol = { path = "../coilbox-tachyon-protocol" }
coilbox-zerok-protocol = { path = "../coilbox-zerok-protocol" }
coilbox-oauth = { path = "../coilbox-oauth" }
# The relay agent sidecar's control channel, shared with the sidecar itself so
# a change to a message breaks both builds rather than one of them at runtime.
coilbox-relay-protocol = { path = "../coilbox-relay-protocol" }
# Spawning the relay agent, which is the one child that has to survive coilbox
# closing, and asking the OS whether the one named in a run file is still
# there.
coilbox-proc = { path = "../coilbox-proc" }
tauri-plugin-opener = "2"
# rustls-tls keeps OpenSSL out of the build, the same reason the downloads plugin
# picks it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
tokio ={ version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Zero-K's protocol has no application-level keepalive, so the socket needs TCP
# keepalive and tokio has no way to set it. Already a direct dependency of the
# direct-hosting plugin, at this version.
socket2 = { version = "0.6", features = ["all"] }
