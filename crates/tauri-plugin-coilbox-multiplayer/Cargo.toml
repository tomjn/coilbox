[package]
name = "tauri-plugin-coilbox-multiplayer"
version = "0.0.0"
description = "Live lobby client (Rust half): tokio socket, TLS/STLS, login state machine, and Channel event streaming driving the coilbox-lobby-protocol engine. ACL identifier: coilbox-multiplayer"
edition = "2021"
license = "MIT"
# Tauri requires `links` to equal `package.name`. The ACL identifier is this name
# with the `tauri-plugin-` prefix stripped -> `coilbox-multiplayer`.
links = "tauri-plugin-coilbox-multiplayer"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# Paused time, so the test for the request timeout does not wait out the real
# fifteen seconds.
tokio = { version = "1", features = ["test-util"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
picoframe-core = "0.0.4"
coilbox-portable = { path = "../coilbox-portable" }
coilbox-lobby-protocol = { path = "../coilbox-lobby-protocol" }
coilbox-tachyon-protocol = { path = "../coilbox-tachyon-protocol" }
tauri-plugin-coilbox-lobby-servers = { path = "../tauri-plugin-coilbox-lobby-servers" }
tauri-plugin-opener = "2"
# rustls-tls keeps OpenSSL out of the build, the same reason the downloads plugin
# picks it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
